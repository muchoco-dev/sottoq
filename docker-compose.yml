services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sottoq
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      TZ: Asia/Tokyo
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    profiles: ["full"]
    build: .
    container_name: sottoq
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://app:app@db:3306/sottoq
      TZ: Asia/Tokyo
      SLACK_SOCKET_MODE: "0"
    networks:
      - default
      - sottoq
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:

networks:
  sottoq:
    name: sottoq
    external: true
